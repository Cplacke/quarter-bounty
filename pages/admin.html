<!DOCTYPE html>
<html lang="en">
    <head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Quarter Bounties</title>

    <style>
        body{
            margin:0;
            font-family:"Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background:#F5F2EC;
            color:#3C454D;
            /* display:flex; */
            justify-content:center;
            align-items:center;
        }

        /* Main card */
        .container-lg{
            background:#FFFFFF;
            /* padding:60px; */
            border-radius:18px;
            box-shadow:0 12px 30px rgba(0,0,0,.08);
            text-align:center;
            /* min-width:420px;
            max-width: 600px; */
        }

        /* Heading */

        h1{
            margin:0 0 40px;
            font-size:2.8rem;
            color:#2F3A44;
            font-weight:700;
            letter-spacing:1px;
        }

        /* Buttons */

        .bounty-rates{
            text-align: left;
            align-items: center;
            /* display: inline-flex; */
            /* flex-direction: column; */
            margin-top: 0px;
        }

        .title{
            margin-top: 10px;
            font-size: 1.10rem;
            color: #505350;
            font-weight: bold;
        }
        .subheader{
            color:#7C807C;
            margin-bottom:35px;
            font-size:.95rem;
        }
    </style>
    <script>
        const updateGuildCode = () => {
            const code = document.querySelector('#guild-code').value
            localStorage.setItem('guild-code', code)
        }
        const renderGuildCode = () => {
            const code = localStorage.getItem('guild-code')
            document.querySelector('#guild-code').value = code
        }
        window.onload = () => {
            renderGuildCode()
        }
    </script>

    </head>
    <body>

        <div class="container"> 
            <div class="card w-100 w-lg-50 m-auto my-5">
                <div class="card-body">
                    <h2 class="my-2">Quarter Bounty Admin</h2>

                    <div class="subheader">
                        <div class="title"> Welcome, Guild Master. </div>
                        <div> Please enter Guild ID Password to unlock. </div>
                        <div class="input-group mb-3">
                            <span class="input-group-text" id="basic-addon1">#</span>
                            <input id="guild-code" type="text" class="form-control" 
                                placeholder="Guild ID" aria-describedby="basic-addon1">
                        </div>
                    </div>
                    <button type="button" class="d-block btn btn-danger w-100 w-lg-50"
                            onclick="updateGuildCode()">
                        Submit
                    </button>
                </div>
            </div>
        </div>

    </body>
</html>
