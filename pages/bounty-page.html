<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <title>State Quarters Bounties</title>
    <style>
        body {
            background: #F5F2EC;
            color: #3C454D;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        input[type='checkbox'] {
            width: 20px;
            height: 20px;
        }

        /* ---------- TABLE ---------- */

        .bounty-table {
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
            background: #FFFFFF;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .08);
            border: 1px solid #D9D4CB;
        }

        .headers {
            background: #2F3A44;
            color: #F5F2EC;
            padding: 14px 16px;
            font-weight: 600;
            text-transform: uppercase;
            border: none;
        }

        .headers:first-child {
            border-top-left-radius: 12px;
        }

        .headers:last-child {
            border-top-right-radius: 12px;
        }

        #quarters > div {
            padding: 1px 16px;
            border-bottom: 1px solid #ECE8E1;
            color: #3C454D;
            transition: background .2s ease;
        }

        #quarters > div:last-child {
            border-bottom: none;
        }

        #quarters > div:nth-child(even) {
            background: #FAF8F5;
        }

        #quarters > div:hover {
            background: #EEF3F2;
        }

        /* ---------- IMAGES ---------- */


        img.thumbnail {
            height: 55px;
            display: block;
            margin: auto;
            transition: transform 0.2s ease-in-out;
            transform-origin: center;
        }

        .row:hover img.thumbnail {
            /* transition-delay: 500ms; */
            transform: scale(2.5);
            z-index: 100;
            position: relative;
        }

        /* ---------- PROGRESS BAR ---------- */

        .progress-container {
            width: 100%;
            height: 20px;
            margin: 20px 0;
            background: #DDD8D0;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #6F8E91, #8FAFA9);
            border-radius: 999px;
            transition: width .35s ease;
        }

        /* ---------- YEAR TAGS ---------- */
        .year-1999, .year-2010, .year-2020 { background: #A85555; color: white; border: none; }
        .year-2000, .year-2011, .year-2021 { background: #C28E4F; color: white; border: none; }
        .year-2001, .year-2012 { background: #5D768E; color: white; border: none; }
        .year-2002, .year-2013 { background: #6B8F71; color: white; border: none; }
        .year-2003, .year-2014 { background: #76648F; color: white; border: none; }
        .year-2004, .year-2015 { background: #B58DA6; color: white; border: none; }
        .year-2005, .year-2016 { background: #7DAF9B; color: white; border: none; }
        .year-2006, .year-2017 { background: #C77E73; color: white; border: none; }
        .year-2007, .year-2018 { background: #7698B4; color: white; border: none; }
        .year-2008, .year-2019 { background: #5F9EA0; color: white; border: none; }

        /* Common styling for year cells */
        [class^="year-"] {
            padding: 6px 10px;
            border-radius: 999px;
            text-align: center;
            font-weight: 600;
            display: block;
            min-width: 72px;
        }

        /* Target Desktops and Up (Large Breakpoint) */
        @media (max-width: 992px) {
           
        }
    </style>
</head>

<body class="pt-2 pb-5 px-2 px-lg-5">

    <div class="container-lg my-4">
        <h2 class="">{{TITLE}}</h2>
        <h4 class="" id="status"></h4>
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div class="container-lg bounty-table">
            <div class="row headers">
                <div class="col-2 col-lg-1 text-center">Status</div>
                <div class="col-3 col-lg-2 text-center">Year</div>
                <div class="col-3 col-lg-3 text-center">Image</div>
                <div class="col-4 col-lg-6 text-center">Name</div>
            </div>
            <div id="quarters"></div>
        </div>

        <script>
            const data = {{DATA}};
            let claimed = {{CLAIMED}};

            console.log('inital load claimed', claimed)

            const renderItems = (items) => {
                const quarters = document.querySelector('#quarters');
                quarters.replaceChildren(); // clear items so can re-render for filter

                items.forEach((quarter) => {
                    const row = document.createElement('div');
                    row.classList = ['row']
                    row.innerHTML = `
                        <div class="col-2 col-lg-1 align-content-center">
                            <input type="checkbox" class="d-flex mx-auto" 
                                data-key="${quarter.state}"
                            >
                        </div>
                        <div class="col-3 col-lg-2 align-content-center">
                            <div class="year-${quarter.year} w-100 mx-2 mx-lg-0"> ${quarter.year }</div>
                        </div>
                        <div class="col-3 col-lg-3 align-content-center">
                            <img class="thumbnail my-1" src="${quarter.img}"/></div
                        </div>
                        <div class="col-4 col-lg-6 align-content-center">
                            <div>${quarter.state}</div>
                        </div>
                    `;
                    quarters.append(row)
                })
            }

            const updateCount = () => {
                const completed = [...document.querySelectorAll('input[type="checkbox"]')].filter((ele) => (ele.checked)).length;
                document.getElementById("status").innerText = `${completed} out of ${data.length} bounties claimed`;
                document.getElementById("progress-bar").style.width = `${(completed / data.length) * 100}%`;
            }

            // Load saved checkbox states on page load
            renderItems(data);

            document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                const name = checkbox.dataset.key;
                const checked = claimed.find((q) => (q.name === name))?.status;
                
                if (checked) {
                    checkbox.checked = true;
                }

                checkbox.addEventListener('change', async () => {
                    fetch('/api/claim', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name,
                            status: checkbox.checked,
                            guildCode: localStorage.getItem('guild-code')
                        })
                    }).then((response) => {
                        response.json().then((c) => {
                            const index = claimed.findIndex((l) => (l.name === c[0].name))
                            if (index > 0) {
                                claimed = claimed.splice(index, 1, c[0])
                                return
                            }
                            claimed.unshift(c[0])
                            console.info(claimed);
                        })
                    })
                    updateCount();
                });
            });

            updateCount();
        </script>
    </div>
</body>

</html>
