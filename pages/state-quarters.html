    body{
        padding: 5px 60px;
        background:#F5F2EC;
        color:#3C454D;
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* ---------- TABLE ---------- */

    table{
        width:100%;
        border-collapse:separate;
        border-spacing:0;
        overflow:hidden;
        background:#FFFFFF;
        border-radius:12px;
        box-shadow:0 8px 24px rgba(0,0,0,.08);
        border:1px solid #D9D4CB;
    }

    th{
        background:#2F3A44;
        color:#F5F2EC;
        padding:14px 16px;
        font-size:.9rem;
        font-weight:600;
        text-transform:uppercase;
        letter-spacing:.05em;
        border:none;
    }

    th:first-child{
        border-top-left-radius:12px;
    }

    th:last-child{
        border-top-right-radius:12px;
    }

    td{
        padding:5px 16px;
        border-bottom:1px solid #ECE8E1;
        color:#3C454D;
        transition:background .2s ease;
    }

    tr:last-child td{
        border-bottom:none;
    }

    tbody tr:nth-child(even){
        background:#FAF8F5;
    }

    tbody tr:hover{
        background:#EEF3F2;
    }

    /* ---------- IMAGES ---------- */

    img.thumbnail{
        height:48px;
        display:block;
        margin:auto;
        border-radius:8px;
        box-shadow:0 2px 8px rgba(0,0,0,.12);
    }

    /* ---------- PROGRESS BAR ---------- */

    .progress-container{
        width:100%;
        height:20px;
        margin:20px 0;
        background:#DDD8D0;
        border-radius:999px;
        overflow:hidden;
    }

    .progress-bar{
        height:100%;
        background:linear-gradient(90deg,#6F8E91,#8FAFA9);
        border-radius:999px;
        transition:width .35s ease;
    }

    /* ---------- YEAR TAGS ---------- */

    .year-1999{background:#A85555;color:white;border:none;}
    .year-2000{background:#C28E4F;color:white;border:none;}
    .year-2001{background:#5D768E;color:white;border:none;}

    .year-2007{background:#7698B4;color:white;border:none;}
    .year-2008{background:#5F9EA0;color:white;border:none;}

    /* Common styling for year cells */

    [class^="year-"]{
        padding:6px 10px;
        border-radius:999px;
        text-align:center;
        font-weight:600;
        font-size:.8rem;
        display:block;
        min-width:72px;

    `;

  })

  const updateCount = () => {
    let completed = [ ...document.querySelectorAll('input[type="checkbox"]')].filter((ele) => (ele.checked)).length;
    document.getElementById("status").innerText = `${completed} out of ${data.length}`;
    document.getElementById("progress-bar").style.width = `${(completed/data.length)*100}%`;
  }

  // Load saved checkbox states on page load

  document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
    const key = checkbox.dataset.key;
    const savedState = localStorage.getItem(key);

    if (savedState === 'true') {
      checkbox.checked = true;
    }

    // TODO: update this to simple API call with creds to write to a Deno KV instance
    // Save state whenever checkbox changes
    checkbox.addEventListener('change', () => {
      localStorage.setItem(key, checkbox.checked);
      updateCount();
    });
  });
